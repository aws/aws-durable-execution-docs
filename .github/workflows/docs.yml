name: Build and publish documentation
on:
  push:
    branches:
      - main

env:
  AWS_REGION: "us-west-2"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.x
      
      - name: Install dependencies
        # don't bump this without checking if there are new unbundled js/css in the theme
        run: pip install zensical==0.0.40
      
      - name: Verify vendored Mermaid
        run: python3 scripts/vendor_mermaid.py --check

      - name: Verify vendored GLightbox
        run: python3 scripts/vendor_glightbox.py --check

      - name: Verify example references
        run: python3 scripts/check_example_refs.py
      
      - name: Build documentation
        run: zensical build --clean
      
      - name: Upload artifact for GitHub Pages (staging)
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site
      
      - name: Upload artifact for prod deploy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: site

  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  deploy-prod:
    needs: deploy-github-pages
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      TARBALL: aws-durable-execution-docs-${{ github.sha }}.tar.gz
    steps:
      - name: Download built docs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-site
          path: site
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ secrets.SYNC_ROLE }}
          role-session-name: docssyncsession
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Create tarball of docs
        run: tar -czf "${{ env.TARBALL }}" -C site .
      
      - name: Upload tarball to S3
        run: aws s3 cp "${{ env.TARBALL }}" "s3://${{ secrets.S3_BUCKET_NAME }}/${{ env.TARBALL }}"
      
      - name: Invoke Lambda to sync to Gitfarm
        run: |
          aws lambda invoke \
            --function-name "${{ secrets.SYNC_LAMBDA_ARN }}" \
            --payload '{"gitFarmRepo":"${{ secrets.GF_REPO }}","s3FilePath":"${{ env.TARBALL }}","extractArchive":true,"gitHubRepo":"aws-durable-execution-docs","gitHubCommit":"${{ github.sha }}"}' \
            --cli-binary-format raw-in-base64-out \
            output.txt
      
      - name: Check Lambda response for errors
        run: |
          if grep -q "Error" output.txt; then
            cat output.txt
            exit 1
          fi
          cat output.txt
