name: Build and publish documentation
on:
  push:
    branches:
      - main

env:
  AWS_REGION: "us-west-2"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
      
      - name: Install dependencies
        # don't bump this without checking if there are new unbundled js/css in the theme
        run: pip install zensical==0.0.40
      
      - name: Verify vendored Mermaid
        run: python3 scripts/vendor_mermaid.py --check

      - name: Verify vendored GLightbox
        run: python3 scripts/vendor_glightbox.py --check

      - name: Verify example references
        run: python3 scripts/check_example_refs.py
      
      - name: Build documentation
        run: zensical build --clean
      
      - name: Upload artifact for GitHub Pages (staging)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      
      - name: Upload artifact for prod deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site

  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deploy-prod:
    needs: deploy-github-pages
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      TARBALL: aws-durable-execution-docs-${{ github.sha }}.tar.gz
    steps:
      - name: Download built docs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: site
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.SYNC_ROLE }}
          role-session-name: docssyncsession
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Create tarball of docs
        run: tar -czf "${{ env.TARBALL }}" -C site .
      
      - name: Upload tarball to S3
        run: aws s3 cp "${{ env.TARBALL }}" "s3://${{ secrets.S3_BUCKET_NAME }}/${{ env.TARBALL }}"
      
      - name: Invoke Lambda to sync to Gitfarm
        run: |
          aws lambda invoke \
            --function-name "${{ secrets.SYNC_LAMBDA_ARN }}" \
            --payload '{"gitFarmRepo":"${{ secrets.GF_REPO }}","s3FilePath":"${{ env.TARBALL }}","extractArchive":true,"gitHubRepo":"aws-durable-execution-docs","gitHubCommit":"${{ github.sha }}"}' \
            --cli-binary-format raw-in-base64-out \
            output.txt
      
      - name: Check Lambda response for errors
        run: |
          if grep -q "Error" output.txt; then
            cat output.txt
            exit 1
          fi
          cat output.txt
