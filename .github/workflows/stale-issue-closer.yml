name: Stale Issue Closer

on:
  schedule:
    # Avoid the top of the hour; GitHub can delay or drop scheduled workflows
    # during high-load periods.
    - cron: "37 12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  close-stale:
    permissions:
      contents: read
      issues: write
    uses: aws/aws-durable-execution-ci/.github/workflows/stale-issue-closer.yml@962e6f158467681a26769b2b06da98c8f2f62231
    with:
      days-until-close: 14
      close-reason: not_planned
